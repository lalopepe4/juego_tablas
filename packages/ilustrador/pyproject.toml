[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ilustrador"
version = "0.1.0"
description = "Pipeline reutilizable de generacion de ilustraciones con OpenRouter y revision ligera."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10",
  "fastmcp>=2",
]

[project.scripts]
ilustrador-mcp = "ilustrador.mcp:main_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/ilustrador"]
